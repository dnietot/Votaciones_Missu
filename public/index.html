<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concurso | Jurados</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=20261006-logo" />
    <link rel="apple-touch-icon" href="/favicon.png?v=20261006-logo" />
    <link rel="stylesheet" href="/styles.css?v=20261006-guardando" />
  </head>
  <body>
    <div id="app"></div>
    <template id="login-template">
      <main class="login-shell">
        <section class="login-panel">
          <div class="brand-mark">CJ</div>
          <h1>Sistema de jurados</h1>
          <form id="login-form" class="login-form">
            <label>
              Usuario
              <input name="username" autocomplete="username" required />
            </label>
            <label>
              Contraseña
              <input name="password" type="password" autocomplete="current-password" required />
            </label>
            <button type="submit">Entrar</button>
            <p id="login-error" class="form-error" role="alert"></p>
          </form>
          <div class="demo-access">
            <strong>Accesos de prueba</strong>
            <span>Organización: admin / admin2026</span>
            <span>Sistema: sistema / sistema2026</span>
            <span>Tablero: tablero / tablero2026</span>
            <span>jurado1 / jurado1</span>
            <span>jurado2 / jurado2 ... jurado5 / jurado5</span>
          </div>
        </section>
      </main>
    </template>
    <script src="/app.js?v=20261006-guardando"></script>
  </body>
</html>
